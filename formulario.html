<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html">Início</a>
        <a href="jogos.html">Jogos</a>
        <a href="duvidas.html">Dúvidas Frequentes</a>
        <a href="formulario.html">Fale conosco</a>
    </nav>

    <div>
        <form action="">
            <fieldset>
                <legend>Fale conosco</legend>

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome">
                <br>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email">
                <br>

                <label for="assunto">Assunto</label>
                <select name="assunto" id="assunto">
                    <option value="feedback">Opinião</option>
                    <option value="duvida">Dúvida</option>
                    <option value="sugestão">Sugestão</option>
                </select>
                <br>

                <label for="mensagem">Mensagem</label>
                <textarea name="mensagem" id="mensagem" cols="82" rows="20"></textarea>
            </fieldset>

            <button>Enviar</button>
        </form>
    </div>

    <footer>&copy; Todos os direitos reservados de Pedro Henrique Vieira Araujo</footer>


<script>
    function validarForm() {

        let valido = true;

        // EMAIL
        const email = document.getElementById('email');
        const emailText = email.value.trim();


        if (!emailText.includes("@")) {
            valido = false;
        } else {
            const partesEmail = emailText.split("@");


            if (partesEmail[0].length < 3 || partesEmail[0].length > 127) {
                valido = false;
            }
        }

        // NOME
        const nome = document.getElementById("nome");
        const nomeText = nome.value.trim();

        if (nomeText.length < 3) {
            valido = false;
        }

        // MENSAGEM
        const textarea = document.getElementById("mensagem");
        const textoMensagem = textarea.value.trim();

        if (textoMensagem === "") {
            valido = false;
        }

        // RESULTADO FINAL
        if (valido) {
            alert("Recebemos sua mensagem, em breve entraremos em contato!");
        } else {
            alert("Há erros no formulário. Corrija para prosseguir.");
        }
    }

    document.addEventListener("submit", function(e) {
        e.preventDefault();
        validarForm();
    });
</script>

</body>
</html>
